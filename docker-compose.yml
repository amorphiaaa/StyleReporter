services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stylereporter
      POSTGRES_USER: styler
      POSTGRES_PASSWORD: styler
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U styler -d stylereporter"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://styler:styler@postgres:5432/stylereporter
      API_CORS_ORIGINS: http://127.0.0.1:5174,http://localhost:5174
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_SPREADSHEET_ID: ${GOOGLE_SPREADSHEET_ID:-}
      GOOGLE_SHEET_NAME: ${GOOGLE_SHEET_NAME:-Form Responses 1}
      GOOGLE_SHEET_RANGE: ${GOOGLE_SHEET_RANGE:-}
      GOOGLE_QUESTIONNAIRE_VERSION: ${GOOGLE_QUESTIONNAIRE_VERSION:-}
      GOOGLE_REFRESH_EXISTING: ${GOOGLE_REFRESH_EXISTING:-false}
      GOOGLE_SHEETS_ENABLED: ${GOOGLE_SHEETS_ENABLED:-false}
      GOOGLE_SHEETS_TIMEOUT_SECONDS: ${GOOGLE_SHEETS_TIMEOUT_SECONDS:-10}
      ASSET_STORAGE_ENABLED: ${ASSET_STORAGE_ENABLED:-true}
      ASSET_STORAGE_ROOT: ${ASSET_STORAGE_ROOT:-/var/lib/stylereporter/assets}
      ASSET_DOWNLOAD_ENABLED: ${ASSET_DOWNLOAD_ENABLED:-false}
      ASSET_DOWNLOAD_TIMEOUT_SECONDS: ${ASSET_DOWNLOAD_TIMEOUT_SECONDS:-30}
      ASSET_DOWNLOAD_MAX_BYTES: ${ASSET_DOWNLOAD_MAX_BYTES:-20971520}
      GOOGLE_DRIVE_STORAGE_ENABLED: ${GOOGLE_DRIVE_STORAGE_ENABLED:-false}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:-}
      GOOGLE_DRIVE_TIMEOUT_SECONDS: ${GOOGLE_DRIVE_TIMEOUT_SECONDS:-30}
      GOOGLE_DRIVE_OAUTH_CLIENT_JSON: ${GOOGLE_DRIVE_OAUTH_CLIENT_JSON:-}
      GOOGLE_DRIVE_OAUTH_REFRESH_TOKEN: ${GOOGLE_DRIVE_OAUTH_REFRESH_TOKEN:-}
      CANVA_ENABLED: ${CANVA_ENABLED:-false}
      CANVA_API_BASE_URL: ${CANVA_API_BASE_URL:-https://api.canva.com/rest/v1}
      CANVA_ACCESS_TOKEN: ${CANVA_ACCESS_TOKEN:-}
      CANVA_TEMPLATE_ID: ${CANVA_TEMPLATE_ID:-}
      CANVA_SOURCE_TYPE: ${CANVA_SOURCE_TYPE:-design}
      CANVA_TIMEOUT_SECONDS: ${CANVA_TIMEOUT_SECONDS:-60}
      CANVA_POLL_INTERVAL_SECONDS: ${CANVA_POLL_INTERVAL_SECONDS:-1}
      CANVA_POLL_ATTEMPTS: ${CANVA_POLL_ATTEMPTS:-30}
    ports:
      - "8001:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - ./var/assets:/var/lib/stylereporter/assets
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8001
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres-data:
  frontend-node-modules:
