services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stylereporter
      POSTGRES_USER: styler
      POSTGRES_PASSWORD: styler
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U styler -d stylereporter"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://styler:styler@postgres:5432/stylereporter
      API_CORS_ORIGINS: http://localhost:5173
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_SPREADSHEET_ID: ${GOOGLE_SPREADSHEET_ID:-}
      GOOGLE_SHEET_NAME: ${GOOGLE_SHEET_NAME:-Form Responses 1}
      GOOGLE_SHEET_RANGE: ${GOOGLE_SHEET_RANGE:-}
      GOOGLE_QUESTIONNAIRE_VERSION: ${GOOGLE_QUESTIONNAIRE_VERSION:-}
      GOOGLE_REFRESH_EXISTING: ${GOOGLE_REFRESH_EXISTING:-false}
      GOOGLE_SHEETS_ENABLED: ${GOOGLE_SHEETS_ENABLED:-false}
      GOOGLE_SHEETS_TIMEOUT_SECONDS: ${GOOGLE_SHEETS_TIMEOUT_SECONDS:-10}
      ASSET_STORAGE_ENABLED: ${ASSET_STORAGE_ENABLED:-true}
      ASSET_STORAGE_ROOT: ${ASSET_STORAGE_ROOT:-/var/lib/stylereporter/assets}
      CODEX_CLI_ENABLED: ${CODEX_CLI_ENABLED:-true}
      CODEX_CLI_RUNNER_URL: ${CODEX_CLI_RUNNER_URL:-http://host.docker.internal:8787}
      CODEX_CLI_RUNNER_TOKEN: ${CODEX_CLI_RUNNER_TOKEN:-}
      CODEX_CLI_MODEL: ${CODEX_CLI_MODEL:-}
      CODEX_CLI_TIMEOUT_SECONDS: ${CODEX_CLI_TIMEOUT_SECONDS:-600}
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - ./var/assets:/var/lib/stylereporter/assets
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres-data:
  frontend-node-modules:
